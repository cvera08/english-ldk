<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>English LDK</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English LDK">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="confetti-layer" id="confetti"></div>

<div class="app">

    <header class="topbar">
        <button id="btnBack" class="btn-back hidden">← Menú</button>
        <h1 class="brand">🌟 English LDK</h1>
        <div class="spacer"></div>
    </header>

    <main>

        <section id="screen-home" class="screen">

            <p class="tagline">Repasemos el inglés para el próximo examen 🎓</p>

            <div class="settings-bar">
                <span class="settings-label">¿Cuántas preguntas por juego?</span>
                <div class="count-options" id="countOptions">
                    <button data-count="8">8</button>
                    <button data-count="12" class="selected">12</button>
                    <button data-count="16">16</button>
                </div>
            </div>

            <p class="section-hint">Elegí qué jugar 👇</p>

            <button class="card card-featured" id="btnRepaso">
                <div id="repasoBadge" class="card-badge"></div>
                <span class="card-icon">🎯</span>
                <span class="card-title">Repaso general</span>
                <span class="card-sub">Un poquito de todos los temas</span>
            </button>

            <div class="or-divider"><span>o practicá un tema</span></div>

            <div class="topic-grid" id="topicGrid"></div>

            <button id="btnResetScores" class="reset-link">🔄 Reiniciar récords</button>

        </section>

        <section id="screen-quiz" class="screen hidden">

            <div class="quiz-progress">
                <div class="quiz-progress-text" id="quizProgressText"></div>
                <div class="progress-bar"><div class="progress-fill" id="quizProgressFill"></div></div>
            </div>

            <div class="quiz-card">
                <p class="quiz-instruction" id="quizInstruction"></p>
                <div class="quiz-prompt" id="quizPrompt"></div>
                <div class="quiz-options" id="quizOptions"></div>
                <p class="quiz-feedback" id="quizFeedback"></p>
            </div>

        </section>

        <section id="screen-end" class="screen hidden">

            <div class="end-card">
                <div class="end-stars" id="endStars"></div>
                <h2 id="endTitle"></h2>
                <p id="endScore"></p>
                <p id="endBest" class="end-best"></p>

                <button id="btnPracticeMissed" class="btn-practice-missed hidden"></button>

                <div class="end-buttons">
                    <button id="btnRetry" class="btn-primary">🔁 Jugar de nuevo</button>
                    <button id="btnMenu" class="btn-secondary">🏠 Menú</button>
                </div>
            </div>

        </section>

    </main>

</div>

<script src="js/icons.js"></script>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/confetti.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
